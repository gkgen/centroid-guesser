<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>重心Guesser</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eef2;--paper:#f8fafb;--ink:#1d2b3a;--sub:#5d6d7c;--grid:#d3dce3;--guess:#2a6fdb;--truth:#e0245e;--line:#b9c5cf;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a22;--paper:#1a2530;--ink:#e6edf3;--sub:#92a2b1;--grid:#26343f;--guess:#6aa6ff;--truth:#ff5a8a;--line:#3a4b59}}
:root[data-theme="dark"]{--bg:#121a22;--paper:#1a2530;--ink:#e6edf3;--sub:#92a2b1;--grid:#26343f;--guess:#6aa6ff;--truth:#ff5a8a;--line:#3a4b59}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;min-height:100vh;display:flex;justify-content:center;padding:20px 14px}
main{width:100%;max-width:420px}
header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
h1{font-size:22px;font-weight:900;margin:0;letter-spacing:.04em}
.stat{font-size:14px;color:var(--sub);font-variant-numeric:tabular-nums}
.stat b{color:var(--ink);font-size:18px}
.board{background:var(--paper);border:2px solid var(--ink);border-radius:4px;padding:0;line-height:0;
 background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:30px 30px}
canvas{width:100%;height:auto;aspect-ratio:1;display:block;cursor:crosshair;touch-action:manipulation}
.msg{min-height:84px;padding:14px 2px 6px;line-height:1.6}
.msg .big{font-size:26px;font-weight:900}
.msg .small{color:var(--sub);font-size:14px}
.legend{display:flex;gap:16px;font-size:13px;color:var(--sub);margin-bottom:4px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
button{font:inherit;font-weight:900;font-size:16px;color:var(--paper);background:var(--ink);border:0;border-radius:4px;padding:12px 20px;cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:2px solid var(--ink)}
button:focus-visible{outline:3px solid var(--guess);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.panel{background:var(--paper);border:2px solid var(--ink);border-radius:4px;padding:24px 20px}
.panel p{margin:0 0 16px;line-height:1.7}
.hidden{display:none}
.rank{font-size:28px;font-weight:900;margin:4px 0 12px}
</style>
</head>
<body>
<main>
 <header><h1>重心Guesser</h1><div class="stat" id="stat"></div></header>

 <section id="start" class="panel">
  <p>文字や図形の「重心」だと思う場所をクリック。1ピクセルずれるごとに1点減点されます（1問100点満点・全5問）。</p>
  <p class="stat">級は5問の平均ズレで決まります：2px以内で神級、4px・8px・12px・20px以内で達人・上級・中級・初級。</p>
  <p class="stat">重心とは、形を指の先で支えたときにつり合う点のこと。</p>
  <div class="row" style="flex-direction:column;align-items:stretch">
   <button data-mode="easy">Easy　1文字・単純な図形</button>
   <button data-mode="normal" class="alt">Normal　言葉・複合図形</button>
   <button data-mode="hard" class="alt">Hard　2〜3行の文章・模様（中央から外れる）</button>
  </div>
  <p class="stat" id="best" style="margin:14px 0 0"></p>
 </section>

 <section id="game" class="hidden">
  <div class="legend"><span><i class="dot" style="background:var(--guess)"></i>あなたの予想</span><span><i class="dot" style="background:var(--truth)"></i>本当の重心</span></div>
  <div class="board"><canvas id="cv" width="360" height="360" aria-label="重心を当てるキャンバス"></canvas></div>
  <div class="msg" id="msg"></div>
  <div class="row"><button id="next" class="hidden">次の問題</button></div>
 </section>

 <section id="end" class="panel hidden">
  <div class="stat">合計スコア</div>
  <div class="rank" id="final"></div>
  <p id="rankText"></p>
  <p class="stat" id="detail"></p>
  <div class="row"><button id="again">もう一度</button></div>
 </section>
</main>

<script>
const S=360,ROUNDS=5,$=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const off=document.createElement('canvas');off.width=off.height=S;
const octx=off.getContext('2d',{willReadFrequently:true});
const CH=[...'永森愛鬱乙火書国山龍あアKRGaテ区才麗襲彎ぬをヲ憂轟Qgy壽'];
const WORDS=['重心','東京タワー','ありがとう','Centroid','寿限無寿限無','カレーライス','Hello World','猫と犬','鬱蒼','サンドイッチ','ガチャガチャ','Fukuoka','博多ラーメン','balance','天気予報','パピプペポ'];
const FONT='"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif';
const MN={easy:'Easy',normal:'Normal',hard:'Hard'};
let mode='easy',round=0,total=0,target=null,answered=false,dists=[],cent=null;
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function polyPath(c,pts){c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();}
function piece(s){
  const t=pick(['blob','pac','ring','L','star','tri']);
  if(t==='blob'){const n=Math.floor(rnd(5,9)),pts=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2+rnd(-.2,.2),r=rnd(45,150)*s;pts.push([Math.cos(a)*r,Math.sin(a)*r]);}return c=>{polyPath(c,pts);c.fill();};}
  if(t==='star'){const k=Math.floor(rnd(4,7)),pts=[];for(let i=0;i<k*2;i++){const a=i/(k*2)*Math.PI*2,r=(i%2?rnd(40,70):rnd(110,150))*s;pts.push([Math.cos(a)*r,Math.sin(a)*r]);}return c=>{polyPath(c,pts);c.fill();};}
  if(t==='tri'){const pts=[0,1,2].map(i=>{const a=i/3*Math.PI*2+rnd(-.5,.5),r=rnd(90,150)*s;return[Math.cos(a)*r,Math.sin(a)*r];});return c=>{polyPath(c,pts);c.fill();};}
  if(t==='L'){const w=rnd(40,70)*s,a=rnd(110,150)*s,b=rnd(90,140)*s,o=30*s;const pts=[[-a,-a],[-a+w,-a],[-a+w,-a+b],[-a+b+w,-a+b],[-a+b+w,-a+b+w],[-a,-a+b+w]].map(p=>[p[0]+o,p[1]+o]);return c=>{polyPath(c,pts);c.fill();};}
  if(t==='pac'){const a=rnd(.25,.9),r=rnd(110,145)*s;return c=>{c.beginPath();c.moveTo(0,0);c.arc(0,0,r,a,Math.PI*2-a);c.closePath();c.fill();};}
  const R=rnd(120,145)*s,r=rnd(55,85)*s,o=R-r-rnd(4,18)*s;
  return c=>{c.beginPath();c.arc(0,0,R,0,Math.PI*2);c.moveTo(o+r,0);c.arc(o,0,r,0,Math.PI*2);c.fill('evenodd');};
}
function makeShape(){
  const rot=rnd(0,Math.PI*2),dx=rnd(-45,45),dy=rnd(-45,45),body=piece(.85);
  return{draw(c,col){c.save();c.fillStyle=col;c.translate(S/2+dx,S/2+dy);c.rotate(rot);body(c);c.restore();}};
}
function makeHardShape(){
  const n=Math.floor(rnd(4,7)),ps=[];
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2+rnd(-.6,.6),d=rnd(50,95);ps.push({x:Math.cos(a)*d,y:Math.sin(a)*d,rot:rnd(0,Math.PI*2),b:piece(rnd(.28,.5))});}
  return{draw(c,col){c.save();c.fillStyle=col;ps.forEach(p=>{c.save();c.translate(S/2+p.x,S/2+p.y);c.rotate(p.rot);p.b(c);c.restore();});c.restore();}};
}
function makeText(){
  const ch=pick(CH),size=rnd(170,260),x=rnd(-45,45),y=rnd(-40,40),w=Math.random()<.5?900:500,rot=rnd(-.35,.35);
  return{draw(c,col){c.save();c.translate(S/2+x,S/2+y);c.rotate(rot);c.fillStyle=col;c.font=`${w} ${size}px ${FONT}`;c.textAlign='center';c.textBaseline='middle';c.fillText(ch,0,0);c.restore();}};
}
function makeHardText(){
  const word=pick(WORDS),chars=[...word],vert=chars.length>=3&&chars.length<=6&&!/[A-Za-z]/.test(word)&&Math.random()<.35;
  const rot=rnd(-.7,.7),dx=rnd(-35,35),dy=rnd(-35,35),w=Math.random()<.5?900:500;
  return{draw(c,col){
    c.save();c.translate(S/2+dx,S/2+dy);c.rotate(rot);c.fillStyle=col;c.textAlign='center';c.textBaseline='middle';
    if(vert){const sz=Math.min(90,290/chars.length);c.font=`${w} ${sz}px ${FONT}`;chars.forEach((ch,i)=>c.fillText(ch,0,(i-(chars.length-1)/2)*sz*1.08));}
    else{c.font=`${w} 100px ${FONT}`;const m=c.measureText(word).width,sz=Math.min(150,100*rnd(190,270)/m);c.font=`${w} ${sz}px ${FONT}`;c.fillText(word,0,0);}
    c.restore();}};
}
const SENT=[['今日は','いい天気','ですね'],['重心を','当てるのは','意外と難しい'],['The quick','brown fox','jumps over'],['博多ラーメン','替え玉','お願いします'],['Center of','gravity','game'],['明日の天気は','雨のち晴れ'],['吾輩の重心は','どこにあるのか'],['ありがとう','ございます'],['東京タワーと','スカイツリー','どちらが高い'],['Fukuoka is','my home town'],['すもももももも','ももものうち'],['The quick brown fox jumps over the lazy dog'],['春はあけぼの','やうやう白くなりゆく','山ぎは少し明かりて','紫だちたる雲の'],['Please guess','where the center','of gravity is','in this text'],['重心とは物体の','各部分に働く重力の','合力の作用点である']];
function makeExtremeText(){
  const lines=pick(SENT),align=pick(['left','center','right']),w=Math.random()<.5?900:500,rot=rnd(-.3,.3);
  const f=lines.map(()=>rnd(.6,1.3));
  const pc=document.createElement('canvas').getContext('2d');pc.font=`${w} 100px ${FONT}`;
  const m=lines.map((l,i)=>pc.measureText(l).width/100*f[i]),sh=f.reduce((a,v)=>a+1.25*v,0);
  const base=Math.min(120,rnd(170,260)/Math.max(...m),rnd(170,250)/sh),W=Math.max(...m)*base,H=sh*base;
  const dx=rnd(-1,1)*Math.max(0,(S-W)/2-18),dy=rnd(-1,1)*Math.max(0,(S-H)/2-18);
  return{draw(c,col){c.save();c.translate(S/2+dx,S/2+dy);c.rotate(rot);c.fillStyle=col;c.textBaseline='middle';c.textAlign=align;
    const x=align==='left'?-W/2:align==='right'?W/2:0;let y=-H/2;
    lines.forEach((l,i)=>{const sz=base*f[i],lh=sz*1.25;c.font=`${w} ${sz}px ${FONT}`;c.fillText(l,x,y+lh/2);y+=lh;});c.restore();}};
}
function makeExtremeShape(){
  const t=Math.floor(Math.random()*3);
  if(t===0){
    const cx=rnd(-50,50),cy=rnd(-50,50),n=Math.floor(rnd(10,15)),ps=[];
    for(let i=0;i<n;i++){const a=rnd(0,6.3),d=rnd(8,72);ps.push({x:cx+Math.cos(a)*d,y:cy+Math.sin(a)*d,rot:rnd(0,6.3),b:piece(rnd(.14,.32))});}
    return{draw(c,col){c.save();c.fillStyle=col;ps.forEach(p=>{c.save();c.translate(S/2+p.x,S/2+p.y);c.rotate(p.rot);p.b(c);c.restore();});c.restore();}};
  }
  if(t===1){
    const rot=rnd(0,6.3),dx=rnd(-50,50),dy=rnd(-50,50),body=piece(.8),sw=rnd(6,14),gap=rnd(6,16),dir=rnd(0,Math.PI),ph=rnd(0,30);
    const tmp=document.createElement('canvas');tmp.width=tmp.height=S;const q=tmp.getContext('2d');
    return{draw(c,col){q.clearRect(0,0,S,S);q.save();q.fillStyle=col;q.translate(S/2+dx,S/2+dy);q.rotate(rot);body(q);q.restore();
      q.save();q.globalCompositeOperation='destination-out';q.translate(S/2,S/2);q.rotate(dir);
      for(let y=-300+ph;y<300;y+=sw+gap)q.fillRect(-300,y+sw,600,gap);q.restore();c.drawImage(tmp,0,0);}};
  }
  const cx=rnd(-50,50),cy=rnd(-50,50),n=Math.floor(rnd(26,42)),ds=[];
  for(let i=0;i<n;i++){const a=rnd(0,6.3),d=Math.pow(rnd(0,1),.7)*85;ds.push({x:cx+Math.cos(a)*d,y:cy+Math.sin(a)*d,r:rnd(4,22)});}
  return{draw(c,col){c.fillStyle=col;ds.forEach(p=>{c.beginPath();c.arc(S/2+p.x,S/2+p.y,p.r,0,7);c.fill();});}};
}
function centroid(t){
  octx.clearRect(0,0,S,S);t.draw(octx,'#000');
  const d=octx.getImageData(0,0,S,S).data;let sx=0,sy=0,m=0;
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){const a=d[(y*S+x)*4+3];if(a){sx+=(x+.5)*a;sy+=(y+.5)*a;m+=a;}}
  return m?{x:sx/m,y:sy/m}:{x:S/2,y:S/2};
}
function render(guess){
  ctx.clearRect(0,0,S,S);
  target.draw(ctx,css('--ink'));
  if(!guess)return;
  ctx.lineWidth=2;ctx.strokeStyle=css('--line');ctx.setLineDash([5,4]);
  ctx.beginPath();ctx.moveTo(guess.x,guess.y);ctx.lineTo(cent.x,cent.y);ctx.stroke();ctx.setLineDash([]);
  ctx.strokeStyle='#fff';ctx.lineWidth=5;cross(cent);ctx.strokeStyle=css('--truth');ctx.lineWidth=3;cross(cent);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(guess.x,guess.y,9,0,7);ctx.fill();
  ctx.fillStyle=css('--guess');ctx.beginPath();ctx.arc(guess.x,guess.y,6.5,0,7);ctx.fill();
}
function cross(p){ctx.beginPath();ctx.moveTo(p.x-11,p.y);ctx.lineTo(p.x+11,p.y);ctx.moveTo(p.x,p.y-11);ctx.lineTo(p.x,p.y+11);ctx.stroke();}
function stat(){$('stat').innerHTML=`${MN[mode]}　第<b>${Math.min(round+1,ROUNDS)}</b>/${ROUNDS}問　<b>${total}</b>点`;}
function newRound(){
  const text=Math.random()<.5;
  target=mode==='hard'?(text?makeExtremeText():makeExtremeShape()):mode==='normal'?(text?makeHardText():makeHardShape()):(text?makeText():makeShape());cent=centroid(target);answered=false;
  $('msg').innerHTML='<div class="big">どこが重心？</div><div class="small">思う場所をクリック／タップしてください。</div>';
  $('next').classList.add('hidden');stat();render();
}
cv.addEventListener('pointerdown',e=>{
  if(answered)return;answered=true;
  const r=cv.getBoundingClientRect(),g={x:(e.clientX-r.left)*S/r.width,y:(e.clientY-r.top)*S/r.height};
  const d=Math.hypot(g.x-cent.x,g.y-cent.y),pts=Math.max(0,Math.round(100-d));
  total+=pts;dists.push(d);round++;render(g);stat();
  $('msg').innerHTML=`<div class="big">+${pts}点</div><div class="small">ズレ ${d.toFixed(1)} px</div>`;
  $('next').textContent=round>=ROUNDS?'結果を見る':'次の問題';$('next').classList.remove('hidden');$('next').focus();
});
$('next').onclick=()=>{if(round>=ROUNDS)finish();else newRound();};
function show(id){['start','game','end'].forEach(s=>$(s).classList.toggle('hidden',s!==id));}
function begin(){round=0;total=0;dists=[];show('game');newRound();}
function best(v){const k='guesserBest2_'+mode;try{const b=Math.max(+localStorage.getItem(k)||0,v||0);if(v)localStorage.setItem(k,b);return b;}catch(e){return v||0;}}
function finish(){
  show('end');$('final').textContent=`${total} / ${ROUNDS*100}点`;
  const avg=dists.reduce((a,b)=>a+b,0)/dists.length;
  const rk=avg<=2?['神級','平均ズレ2px以内。ほぼ誤差ゼロです。']:avg<=4?['達人級','平均ズレ4px以内。見事な精度です。']:avg<=8?['上級','平均ズレ8px以内。形の偏りをよく読めています。']:avg<=12?['中級','平均ズレ12px以内。あと一歩です。']:avg<=20?['初級','平均ズレ20px以内。感覚をつかみ始めました。']:['見習い級','平均ズレ20px超。面積の大きい部分に重心は引っ張られます。'];
  $('rankText').innerHTML=`<b>${rk[0]}</b>　${rk[1]}`;
  $('detail').textContent=`平均ズレ ${avg.toFixed(1)} px　${MN[mode]}ベスト ${best(total)}点`;
}
$('again').onclick=()=>{show('start');showBest();};
function showBest(){const m=mode,o=['easy','normal','hard'].map(k=>{mode=k;return best(0);});mode=m;$('best').textContent=o.some(Boolean)?`ベスト　Easy ${o[0]}点 / Normal ${o[1]}点 / Hard ${o[2]}点`:'';}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;begin();});
showBest();
</script>
</body>
</html>
